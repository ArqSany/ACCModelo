#pn h2{margin:8px 0 6px;font-size:18px}.mu{color:var(--mu);font-size:13px}

cond:["Condensador","Expulsa al exterior el calor recogido más el del compresor.","Serpentín de tubos de cobre con aletas de aluminio.","Sensor NTC en el tubo; la tarjeta modula el ventilador según la presión.","El gas se condensa y cede calor latente al aire por convección."],
vext:["Ventilador del condensador","Fuerza aire exterior a través del condensador.","Hélice axial con rejilla de protección.","Motor DC o EC con velocidad modulada por PWM.","Leyes de afinidad: caudal ∝ rpm, potencia ∝ rpm³."],
evap:["Evaporador","Absorbe el calor del aire interior y le quita humedad.","Serpentín de aletas y tubos de cobre con charola debajo.","Termistores en los tubos miden entrada y salida para controlar el sobrecalentamiento.","El refrigerante hierve y absorbe calor latente; bajo el punto de rocío el vapor del aire condensa."],
vint:["Ventilador interior","Mueve el aire del espacio a través del evaporador.","Turbina tangencial (pared), blower centrífugo (ductos) o ventilador de cassette.","Motor de velocidad variable gobernado por la tarjeta.","Q = velocidad × área; presión y potencia crecen rápido con las rpm."],
exp:["Válvula de expansión","Baja la presión del líquido para que pueda evaporarse.","Capilar, válvula termostática o electrónica de aguja.","La electrónica (EEV) es un motor a pasos que la tarjeta abre o cierra según el sobrecalentamiento.","Al caer la presión baja la temperatura de saturación (entalpía constante)."],
pcb:["Tarjeta de control","Es el cerebro: lee sensores y decide qué componente actuar.","Placa con relés, conectores y disipadores.","Microcontrolador con lógica PID, protecciones y comunicación entre unidades.","Control en lazo cerrado: compara medición con objetivo y corrige."],
inv:["Módulo inverter","Hace que el compresor varíe su velocidad en lugar de arrancar y parar.","Placa de potencia con disipador de aluminio.","Rectifica AC a DC y la convierte en AC trifásica de frecuencia variable (IGBT y PWM).","Velocidad de un motor síncrono ∝ frecuencia: rpm = 120·f / polos."],
tube:["Tuberías","Llevan refrigerante o agua entre los equipos.","Cobre aislado (refrigerante) o acero y PVC (agua).","Sensores de presión y temperatura vigilan el circuito.","Las pérdidas de presión por longitud y altura reducen capacidad; el aislante evita condensación."],
filt:["Filtro de aire","Retiene polvo para proteger el serpentín y limpiar el aire.","Malla o panel plegado, lavable o reemplazable.","Algunos equipos avisan cuando se satura (presión diferencial).","Un filtro sucio aumenta la pérdida de carga y baja el caudal."],
louv:["Deflector de aire","Dirige el aire frío hacia donde conviene.","Aletas orientables en la salida.","Motor paso a paso que las mueve desde el control remoto.","El aire frío es más denso y cae; el ángulo evita corrientes directas."],
drain:["Charola y drenaje","Recoge y evacúa el agua que condensa el evaporador.","Charola bajo el serpentín y manguera con pendiente.","Algunos equipos tienen interruptor de nivel o flotador.","Bajo el punto de rocío el vapor se condensa (carga latente)."],
acc:["Acumulador","Evita que llegue líquido al compresor.","Recipiente cilíndrico en la línea de succión.","Sin electrónica propia; sensores vigilan la succión.","El líquido no se comprime y daña el compresor: solo debe entrar gas."],
osep:["Separador de aceite","Devuelve al compresor el aceite que escapa con el gas.","Recipiente con malla y tubo de retorno.","Sensor de aceite y control de retorno en sistemas grandes.","El gas pierde velocidad en el recipiente y el aceite, más denso, se separa."],
duct:["Ductos de suministro y retorno","Llevan el aire acondicionado al espacio y de vuelta al equipo.","Lámina galvanizada aislada, circular o rectangular.","Sensores de temperatura y compuertas motorizadas.","Q = V × A; la fricción pierde presión, por eso el ducto se dimensiona."],
econ:["Economizador","Enfría gratis con aire exterior cuando el clima lo permite.","Compuertas con actuador y capota con filtros.","Sensores de temperatura o entalpía y actuador modulante.","Si el aire exterior tiene menos entalpía que el de retorno, se ahorra compresor."],
chev:["Evaporador del chiller","Enfría el agua que se distribuye por el edificio.","Intercambiador de casco y tubos con refrigerante por un lado y agua por el otro.","Sensores de temperatura de agua, flujo y presostatos.","Q = m·cp·ΔT; con agua a 7 °C de salida y 12 °C de retorno el ΔT típico es de 5 °C."],
pump:["Bomba de agua","Hace circular el agua helada por la red.","Bomba centrífuga con rodete, sello y motor.","Variador que ajusta rpm según la presión diferencial.","Curva de la bomba contra curva del sistema; leyes de afinidad."],
